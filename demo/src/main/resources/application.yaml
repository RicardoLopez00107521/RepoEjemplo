spring:
  thymeleaf:
    check-template-location: false
  sql:
    init:
      mode: always
  application:
    name: demo
  mustache:
    suffix: .html
    check-template-location: false
  datasource:
    url: jdbc:mysql://localhost:3306/prubea
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
    show-sql: false
    open-in-view: false
  session:
    jdbc:
      initialize-schema: always
